[package]
name = "logoLoader"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.13.4", features = ["blocking", "json", "cookies"] }
tokio = { version = "1.53.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
kmeans_colors = "0.7.1"
palette = "0.7.6"
base64 = "0.22.1"
oxipng = "10.1.1"
indicatif = "0.18.6"
log = "0.4.33"
fern = "0.7.1"
chrono = "0.4.45"
futures = "0.3.32"
vtracer = "0.6.5"
visioncortex = "0.8.10"
clap = { version = "4.6.2", features = ["derive"] }
imageproc = "0.23"
scraper = "0.27.0"
regex = "1.13.1"
url = "2.5.8"
once_cell = "1.21.4"
toml = "1.1.3+spec-1.1.0"
urlencoding = "2.1.3"
dotenv = "0.15"